name: Sync Genshin Data

on:
  # Genshin patches drop roughly every 6 weeks on a Wednesday.
  # Run weekly on Wednesday morning to catch patches day-of.
  schedule:
    - cron: '0 6 * * 3'

  # Also run manually from the Actions tab — useful right after a patch.
  workflow_dispatch:
    inputs:
      entity:
        description: 'Entity type to sync (leave blank for all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - characters
          - weapons
          - materials
          - enemies

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated data files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        env:
          AWS_ID:  ${{ secrets.AWS_ID }}
          AWS_KEY: ${{ secrets.AWS_KEY }}
          R2_ID:   ${{ secrets.R2_ID }}
        run: node scripts/sync.mjs ${{ github.event.inputs.entity || 'all' }}

      - name: Commit new data (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            VERSION=$(date -u +'%Y-%m-%d')
            git commit -m "data: sync new content ($VERSION)"
            git push
          fi
